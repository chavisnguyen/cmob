name: Release
# User flow: create a GitHub Release with a tag such as v0.1.0.
# gate -> binary (arm64 + x64) -> attach -> bump-formula, in this order in one workflow, so the in-repo
# Homebrew Formula/cmob.rb never points at assets that do not exist yet.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - Cargo.toml version matches the release tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' repos/cmux-gateway/Cargo.toml | head -1)
          test "$VERSION" = "${TAG#v}" || { echo "Cargo.toml says $VERSION but the tag is $TAG"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos/cmux-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install client dependencies
        run: cd repos/cmux-client && pnpm install --frozen-lockfile
      - run: npm install -g vite-plus
      - name: Client checks and tests
        run: cd repos/cmux-client && vp check && vp test --run
      - name: Build
        run: make build
      - name: Gateway tests
        run: cd repos/cmux-gateway && cargo test --all

  binary:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: cmob-macos-arm64
          - os: macos-15-intel
            asset: cmob-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos/cmux-gateway
      - name: Build
        run: make build
      - name: Stage and smoke-test the binary
        run: |
          cp repos/cmux-gateway/target/release/cmob "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          ./"${{ matrix.asset }}" --version
          ./"${{ matrix.asset }}" --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  attach:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Guard - both binaries present
        run: |
          test -f assets/cmob-macos-arm64
          test -f assets/cmob-macos-x64
      - name: Attach to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" assets/* --clobber --repo "${{ github.repository }}"

  bump-formula:
    needs: attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Rewrite Formula/cmob.rb from the template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          WORK=$(mktemp -d)
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern cmob-macos-arm64 --pattern cmob-macos-x64 --dir "$WORK"
          SHA_ARM=$(sha256sum "$WORK/cmob-macos-arm64" | cut -d' ' -f1)
          SHA_X64=$(sha256sum "$WORK/cmob-macos-x64" | cut -d' ' -f1)
          mkdir -p Formula
          sed -e "s|{{REPO}}|${{ github.repository }}|g" \
              -e "s|{{VERSION}}|${VERSION}|g" \
              -e "s|{{SHA_ARM}}|${SHA_ARM}|g" \
              -e "s|{{SHA_X64}}|${SHA_X64}|g" \
              packaging/homebrew/cmob.rb.template > Formula/cmob.rb
          git config user.name "cmob-bot"
          git config user.email "cmob-bot@users.noreply.github.com"
          git add Formula/cmob.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "chore(formula): bump to ${TAG}"
          git push
