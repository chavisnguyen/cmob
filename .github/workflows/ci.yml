name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-build:
    name: Test & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos/cmux-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Client Dependencies
        run: |
          cd repos/cmux-client
          pnpm install --no-frozen-lockfile

      - name: Install Vite+ CLI
        run: npm install -g vite-plus

      - name: Run Client Checks & Unit Tests
        run: |
          cd repos/cmux-client
          vp check
          vp test --run

      - name: Build Full Production Gateway Binary
        run: |
          make build

      - name: Run Gateway Unit & Offline Mock Tests
        run: |
          cd repos/cmux-gateway
          cargo test --all
