<!doctype html>
<html lang="en" data-orca-scrollbars="sleek">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111217" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="cmux" />
    <title>cmux mobile</title>
    <style id="orca-scrollbars">
      .scrollbar-sleek,
      :where([data-orca-scrollbars="sleek"] *) {
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--muted-foreground, #737373) 34%, transparent)
          transparent;
      }
      .scrollbar-sleek::-webkit-scrollbar,
      :where([data-orca-scrollbars="sleek"] *)::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-sleek::-webkit-scrollbar-track,
      :where([data-orca-scrollbars="sleek"] *)::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-sleek::-webkit-scrollbar-thumb,
      :where([data-orca-scrollbars="sleek"] *)::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--muted-foreground, #737373) 28%, transparent);
        border-radius: 9999px;
      }
      .scrollbar-sleek::-webkit-scrollbar-thumb:hover,
      :where([data-orca-scrollbars="sleek"] *)::-webkit-scrollbar-thumb:hover {
        background-color: color-mix(in srgb, var(--muted-foreground, #737373) 48%, transparent);
      }
    </style>
  </head>
  <body class="bg-[#111217] text-gray-100 select-none overflow-hidden overscroll-none">
    <script>
      /* Standalone iOS PWA & Mobile Web Session Cross-Hydration */
      (function () {
        try {
          var searchMatch = window.location.search.match(/[?&]token=([^&#]+)/);
          var searchToken = searchMatch ? decodeURIComponent(searchMatch[1]) : null;
          var hashMatch = window.location.hash.match(/[#&]token=([^&#]+)/);
          var hashToken = hashMatch ? decodeURIComponent(hashMatch[1]) : null;
          var cookieMatch = document.cookie.match(/(?:^|;\s*)cmux_token=([^;]+)/);
          var cookieToken = cookieMatch ? decodeURIComponent(cookieMatch[1]) : null;
          var lsToken = localStorage.getItem("cmux_token");
          var token = searchToken || hashToken || cookieToken || lsToken;

          if (token) {
            localStorage.setItem("cmux_token", token);
            document.cookie =
              "cmux_token=" +
              encodeURIComponent(token) +
              "; path=/; max-age=31536000; SameSite=Lax";
            if (!window.location.hash || window.location.hash === "#") {
              window.location.hash = "token=" + encodeURIComponent(token);
            }
          }
        } catch (e) {
          /* Ignore storage / iframe sandbox exceptions */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
